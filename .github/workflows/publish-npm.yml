name: Publish @gluztm/dsh-guard to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Optional git tag/ref to publish (empty = current default branch)'
        required: false
        default: ''
        type: string
      dist_tag:
        description: 'npm dist-tag (use legacy when backfilling older versions)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dsh-guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || '' }}

      - name: Setup Node.js 24 (npm OIDC ready)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run verification gates and check tarball
        run: |
          node --version
          npm --version
          for f in lib/*.mjs lib/*.js bin/*.mjs; do
            if [ -f "$f" ]; then
              node --check "$f"
            fi
          done
          if [ -z "${{ inputs.git_ref }}" ]; then
            node test/smoke.mjs
          fi
          npm pack --dry-run

      - name: Publish to npm via OIDC Trusted Publishing
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view "@gluztm/dsh-guard@${LOCAL_VER}" version --registry=https://registry.npmjs.org 2>/dev/null || echo "")
          if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "@gluztm/dsh-guard@$LOCAL_VER is already published on npm; skipping duplicate publish."
            exit 0
          fi
          DIST_TAG="${{ inputs.dist_tag || 'latest' }}"
          npm publish --provenance --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org
